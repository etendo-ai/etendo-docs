                    - "¿Qué son las vistas Cobro y Pago?": tesoreria/que-es-cobros-y-pagos/que-es-cobros-y-pagos.md
                    - Registrar un cobro: tesoreria/como-registrar-un-cobro/como-registrar-un-cobro.md
                    - Registrar un pago: tesoreria/como-registrar-un-pago/como-registrar-un-pago.md
                - Cuentas:
                    - Añadir y configurar un banco, tarjeta o caja: tesoreria/como-anadir-y-configurar-un-banco-tarjeta-o-caja/como-anadir-y-configurar-un-banco-tarjeta-o-caja.md
                    - Editar una cuenta: tesoreria/como-editar-una-cuenta/como-editar-una-cuenta.md
                    - Conectar, desconectar, archivar, desarchivar o eliminar una cuenta: tesoreria/como-conectar-desconectar-desactivar-o-eliminar-una-cuenta-bancaria/como-conectar-desconectar-desactivar-o-eliminar-una-cuenta-bancaria.md
                    - Gestionar caja y movimientos en efectivo: tesoreria/como-gestionar-caja-y-movimientos-en-efectivo/como-gestionar-caja-y-movimientos-en-efectivo.md
                - Extracto bancario:
                    - Importar o descargar el extracto bancario: tesoreria/como-importar-o-descargar-el-extracto-bancario/como-importar-o-descargar-el-extracto-bancario.md
                    - Borrar un extracto o un movimiento: tesoreria/como-borrar-transacciones-del-extracto-bancario/como-borrar-transacciones-del-extracto-bancario.md
                - Conciliación bancaria:
                    - ¿Qué es la conciliación bancaria en Etendo?: tesoreria/que-es-la-conciliacion-bancaria-en-etendo/que-es-la-conciliacion-bancaria-en-etendo.md
                    - Conciliar o desconciliar movimientos contra documentos: tesoreria/como-conciliar-o-desconciliar-movimientos-contra-documentos/como-conciliar-o-desconciliar-movimientos-contra-documentos.md
