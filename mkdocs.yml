                    - Cómo invitar a un usuario: sistema/configuracion/como-invitar-a-un-usuario/como-invitar-a-un-usuario.md
                    - Gestionar tus usuarios: sistema/configuracion/gestionar-tus-usuarios/gestionar-tus-usuarios.md
                    - Glosario de Roles y usuarios: sistema/configuracion/glosario-de-roles-y-usuarios/glosario-de-roles-y-usuarios.md

  - glightbox
  - tags
  - git-committers:
      repository: etendosoftware/etendo-docs
      branch: develop
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: true
      type: date
  - social
  - redirects:
      redirect_maps:
        # Renombrados en ETP-6115: la interfaz dice "cobro", no "pago"
        es/comercial/ventas/anadir-pagos-a-tu-factura-de-venta/anadir-pagos-a-tu-factura-de-venta.md: es/comercial/ventas/anadir-cobros-a-tu-factura-de-venta/anadir-cobros-a-tu-factura-de-venta.md
        # Generalizado en ETP-6115: la ventana de envio es la misma en todos los documentos
        es/comercial/ventas/enviar-tus-facturas-por-email/enviar-tus-facturas-por-email.md: es/comercial/ventas/enviar-documentos-por-email/enviar-documentos-por-email.md
        # Movidos a Tesorería en ETP-5532: el menú de la app separa Tesorería de Finanzas
        finanzas/como-gestionar-pagos-y-cobros/como-gestionar-pagos-y-cobros.md: https://help.etendo.ai/tesoreria/como-gestionar-pagos-y-cobros/como-gestionar-pagos-y-cobros/
        finanzas/que-es-cobros-y-pagos/que-es-cobros-y-pagos.md: https://help.etendo.ai/tesoreria/que-es-cobros-y-pagos/que-es-cobros-y-pagos/
