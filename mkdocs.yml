        finanzas/como-gestionar-caja-y-movimientos-en-efectivo/como-gestionar-caja-y-movimientos-en-efectivo.md: https://help.etendo.ai/tesoreria/como-gestionar-caja-y-movimientos-en-efectivo/como-gestionar-caja-y-movimientos-en-efectivo/
        finanzas/como-importar-o-descargar-el-extracto-bancario/como-importar-o-descargar-el-extracto-bancario.md: https://help.etendo.ai/tesoreria/como-importar-o-descargar-el-extracto-bancario/como-importar-o-descargar-el-extracto-bancario/
        finanzas/como-borrar-transacciones-del-extracto-bancario/como-borrar-transacciones-del-extracto-bancario.md: https://help.etendo.ai/tesoreria/como-borrar-transacciones-del-extracto-bancario/como-borrar-transacciones-del-extracto-bancario/
